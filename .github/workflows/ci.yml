name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture gates (dependency-cruiser)
        run: pnpm depcruise

      - name: Test
        run: pnpm test

      # `pnpm verify` NO empaqueta para workerd, así que un import que arrastre NestJS, nodemailer o
      # cualquier módulo de Node al Worker pasa verify en verde y solo falla al desplegar. Ya ocurrió
      # una vez (ver docs/CLOUDFLARE.md). No necesita credenciales.
      - name: Cloudflare Worker bundles (dry-run)
        run: pnpm --filter @app/api exec wrangler deploy --dry-run --outdir /tmp/worker-bundle

      # Y el dry-run solo prueba que el bundle SE CONSTRUYE. Esto lo ARRANCA en workerd y le hace
      # peticiones reales: es lo que caza el «verde en CI, crash-loop en producción». Tampoco necesita
      # credenciales (miniflare corre el runtime en local).
      - name: Cloudflare Worker runs (workerd)
        run: pnpm --filter @app/api test:workers

  contract-semver-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Un breaking change de @core/contracts sin changeset (bump SemVer) rompe CI.
      - name: Require changeset for @core/contracts changes
        run: pnpm changeset status --since=origin/main
